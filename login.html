<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | М'ясо і Вогонь</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap');

        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: 'Montserrat', sans-serif; }
        h1, .logo { font-family: 'Playfair Display', serif; }
        header {
            position: fixed; top: 0; width: 100%; background-color: rgba(17, 17, 17, 0.95);
            padding: 20px 50px; display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; border-bottom: 1px solid #333;
        }
        .logo { font-size: 24px; color: #FF7900; }
        .login-page { padding: 150px 20px 100px; max-width: 500px; margin: 0 auto; text-align: center; }
        .login-page h1 { font-size: 42px; color: #FF7900; margin-bottom: 30px; }
        .form-container { background: #222; padding: 40px; border-radius: 8px; border: 1px solid #333; text-align: left; }
        input {
            background-color: #111; border: 1px solid #444; color: white; padding: 15px;
            font-size: 16px; width: 100%; box-sizing: border-box; margin-bottom: 20px; color-scheme: dark;
        }
        input:focus { outline: none; border-color: #FF7900; }
        .btn-primary {
            background-color: #FF7900; color: #000; padding: 15px; font-size: 18px;
            font-weight: 600; border: none; border-radius: 4px; cursor: pointer; width: 100%; transition: 0.3s;
        }
        .btn-primary:hover { background-color: #e66a00; }
        .reg-link { display: inline-block; margin-top: 20px; color: #aaa; text-decoration: none; }
        .reg-link a { color: #FF7900; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="logo">М'ясо і Вогонь</div>
        <a href="index.html" style="color: #FF7900; text-decoration: none;">На головну</a>
    </header>

    <main class="login-page">
        <h1>Вхід у кабінет</h1>
        <div class="form-container">
            <form action="login.php" method="POST">
                <input type="email" name="email" placeholder="Електронна пошта" required>
                <input type="password" name="password" placeholder="Пароль" required>
                <button type="submit" class="btn-primary">Увійти</button>
            </form>
        </div>
        <div class="reg-link">Ще не зареєстровані? <a href="registration.html">Створити профіль</a></div>
    </main>

</body>
</html>
